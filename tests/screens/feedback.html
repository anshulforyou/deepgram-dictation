<!doctype html><html><head><meta charset="utf-8"><title>Program feedback</title><style>
*{box-sizing:border-box}body{margin:0;font:15px -apple-system,BlinkMacSystemFont,sans-serif;color:#0f172a;background:#f4f1ec;height:100vh;display:grid;place-items:center}
.box{background:#fff;width:720px;border-radius:12px;padding:36px;box-shadow:0 10px 30px rgba(15,23,42,.08)}h1{margin:0 0 6px;font-size:22px}p{color:#64748b;margin:0 0 22px}
label{display:block;font-weight:600;margin:18px 0 6px;font-size:14px}textarea,input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:15px/1.5 -apple-system,sans-serif}
textarea{height:170px;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
button{margin-top:22px;padding:12px 22px;border:0;border-radius:8px;background:#0f172a;color:#fff;font-weight:600}
</style></head><body><div class="box"><h1>Mid-program check-in</h1><p>Tell us how the accelerator has gone so far. Your answers go to the program team.</p>
<label>Company name</label><input value="Acme">
<label>What has not worked for you?</label><textarea>The program are not structured at all, and i has to go back and forth between thing. The quality of the material provided were subpar. The team hadnt spend any time getting to know our product or brand, and even the name of the product is wrong in there drafts.</textarea>
<button>Submit</button></div></body></html>
