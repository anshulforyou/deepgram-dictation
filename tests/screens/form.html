<!doctype html><html><head><meta charset="utf-8"><title>Create account</title><style>
*{box-sizing:border-box}body{margin:0;font:15px -apple-system,BlinkMacSystemFont,sans-serif;color:#0f172a;background:#eef2f7;height:100vh;display:grid;place-items:center}
.box{background:#fff;width:440px;border-radius:12px;padding:32px;box-shadow:0 10px 30px rgba(15,23,42,.08)}h1{margin:0 0 6px;font-size:22px}p{color:#64748b;margin:0 0 22px}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:13px}input{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
.err input{border-color:#dc2626;background:#fef2f2}.msg{color:#dc2626;font-size:13px;margin-top:6px}.chk{margin:18px 0;color:#334155;font-size:13px}
button{width:100%;padding:12px;border:0;border-radius:8px;background:#94a3b8;color:#fff;font-weight:600;font-size:15px}
.alert{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:8px}
</style></head><body><div class="box"><h1>Create your Parcelly account</h1><p>Ship from your store in minutes.</p>
<div class="alert">Please fix 2 errors below before continuing.</div>
<label>Work email</label><input value="sam@brightloop.io">
<div class="err"><label>Password</label><input type="password" value="sunshine"><div class="msg">Password must be at least 10 characters and include a number.</div></div>
<div class="err"><label>Company VAT ID</label><input value="GB12345"><div class="msg">VAT ID should look like GB123456789 (9 digits after GB).</div></div>
<div class="chk">☐ I agree to the Terms of Service</div><button disabled>Create account</button></div></body></html>
