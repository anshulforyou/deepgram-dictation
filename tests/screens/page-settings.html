<!doctype html><html><head><meta charset="utf-8"><title>Page settings</title><style>
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;color:#1c1f24;background:#f5f6f8;height:100vh;display:grid;grid-template-columns:240px 1fr}
aside{background:#fff;border-right:1px solid #e3e5e8;padding:20px 14px}aside b{display:block;font-size:17px;margin:0 8px 20px}aside a{display:block;padding:8px 10px;border-radius:6px;color:#3a3f47}aside a.on{background:#eef1f6;font-weight:600}
main{padding:28px 44px;max-width:980px}h1{font-size:21px;margin:0 0 18px}.card{background:#fff;border:1px solid #e3e5e8;border-radius:10px;padding:22px;margin-bottom:18px}
h2{font-size:15px;margin:0 0 12px}label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}label:first-of-type{margin-top:0}
.in{border:1px solid #cdd1d6;border-radius:8px;padding:9px 12px;color:#9aa0a6;min-height:38px}.ta{min-height:76px}
.img{display:flex;gap:16px;align-items:center}.ph{width:190px;height:100px;background:#e9ebee;border-radius:8px;display:grid;place-items:center;color:#9aa0a6;font-size:12px}
.ph.sq{width:100px}.btn{border:1px solid #cdd1d6;border-radius:8px;padding:8px 14px;background:#fff;font-weight:600}
small{color:#6b7280;display:block;margin-top:6px}.save{position:absolute;top:24px;right:44px;background:#1c1f24;color:#fff;border-radius:8px;padding:9px 18px;font-weight:600}
</style></head><body>
<aside><b>Pagecraft</b><a>Pages</a><a class="on">Page settings</a><a>Domains</a><a>Analytics</a><a>Team</a></aside>
<main><div class="save">Save changes</div><h1>Page settings</h1>
<div class="card"><h2>General</h2><label>Project name</label><div class="in"></div>
<label>Project SEO description</label><div class="in ta"></div><label>Redirect URL</label><div class="in">https://</div></div>
<div class="card"><h2>Page sharing content</h2><label>Sharing image</label>
<div class="img"><div class="ph">1200 x 630</div><span class="btn">Upload</span></div><small>Shown when the page is shared. Recommended 1200 x 630 px.</small>
<label>Logo</label><div class="img"><div class="ph sq">Square</div><span class="btn">Upload</span></div><small>Square, at least 256 x 256 px.</small></div>
</main></body></html>
